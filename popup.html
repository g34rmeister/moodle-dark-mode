<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0; padding: 14px 16px; width: 240px;
      background: #1e1b26; color: #e7e4ee;
      font: 14px system-ui, sans-serif;
    }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
    label + label { margin-top: 12px; }
    label.disabled { opacity: 0.45; cursor: default; }
    small { display: block; color: #a8a2b8; font-size: 12px; margin-top: 2px; }
    /* flex-shrink: 0 — a long label must not squeeze the switch (the knob's travel
       assumes exactly 38px); margin: 0 drops Chrome's default checkbox margins */
    input { appearance: none; flex-shrink: 0; margin: 0; width: 38px; height: 22px; border-radius: 11px;
            background: #3a3548; position: relative; cursor: pointer; transition: background .15s; }
    input:focus { outline: none; }
    input:focus-visible { outline: 2px solid #fdd023; outline-offset: 2px; }
    input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                   border-radius: 50%; background: #e7e4ee; transition: left .15s; }
    input:checked { background: #6d4fc4; }
    input:checked::after { left: 19px; background: #fdd023; }
  </style>
</head>
<body>
  <label>Dark mode <input type="checkbox" id="toggle"></label>
  <label id="amoled-row"><span>AMOLED black<small>True black, saves battery on OLED</small></span>
    <input type="checkbox" id="amoled"></label>
  <script src="popup.js"></script>
</body>
</html>
