<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>workday</title>
<style>
  /* Workday writes its colors in oklch(), which stays oklch() in computed styles */
  /* Workday's grey page is a full-window <div>, not <body>; white cards sit on it */
  body { margin: 0; }
  /* Canvas Kit tokens, as Workday defines them on :root */
  :root { --cnvs-sys-color-bg-default: rgba(255,255,255,1); --cnvs-sys-color-text-default: rgba(73,73,73,1); --cnvs-sys-color-border-container: rgba(206,211,217,1); }
  .tok { background: var(--cnvs-sys-color-bg-default); color: var(--cnvs-sys-color-text-default); border: 1px solid var(--cnvs-sys-color-border-container); }
  .page { min-height: 100vh; background: oklch(0.9692 0.0035 248.23); }
  .card { background: oklch(1 0 0); color: oklch(0.0969 0 0 / 0.84); }
  .wd-icon-fill { fill: oklch(0.2891 0 0); }
  .chip { display: inline-block; background: rgb(215, 187, 251); }
  .chip .wd-icon-fill { fill: #333; }
  /* Grid cells and buttons animate every property */
  .cell { background: #fff; transition: all 0.3s ease-in; }
  .divider { height: 1px; border: 0; background: oklch(0.856 0.0111 256.85); }
  /* The rule that removes an icon background's (initial, black) fill depends on the
     button's state, so for a moment it doesn't match */
  .nav.ready .wd-icon-background { fill: none; }
  /* A fixed action bar the same grey as the page: content scrolls under it */
  /* A pop-up menu: white on the white canvas, raised with a shadow */
  .pop { position: absolute; top: 8px; right: 8px; z-index: 10; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
  /* Search suggestions: a static white panel inside a transparent fixed wrapper */
  .float-wrap { position: fixed; top: 60px; left: 8px; z-index: 50; }
  .sugg { background: #fff; }
  /* Hover highlights: Workday's lavender menu row, myLSU's gold link row */
  .hrow, .grow { width: 300px; height: 24px; }
  .hrow span { color: #333; }
  .hrow:hover { background: #f3eeff; }
  .grow a { color: rgb(102, 68, 153); }
  .grow:hover { background: #fdd023; }
  /* A side-menu item that fades in a pale tint when selected (Workday, 4 s here) */
  .fade { height: 30px; width: 200px; transition: background-color 4s linear; }
  .fade.sel { background: #f6f0ff; }
  /* A box that animates every property, added after load: our recoloring must not fade */
  .slow { height: 20px; background: #fff; transition: all 3s linear; }
  /* Org chart: white cards edged only by a shadow, joined by near-black border lines */
  .org-card { width: 120px; height: 40px; background: oklch(1 0 0); box-shadow: rgba(0, 0, 0, 0.1) 0 4px 8px; }
  .org-line { display: block; width: 0; height: 20px; border-left: 0.8px solid oklch(0.0969 0 0 / 0.84); }
  /* myLSU's sidebar row: light grey, purple on hover, fading between them */
  .prow { width: 300px; height: 24px; background: #dcdcdc; transition: all 0.6s ease-in-out; }
  .prow:hover { background: rgb(70, 29, 124); }
  /* myLSU: a white search pill on a light grey sidebar */
  .side { width: 200px; padding: 8px; background: #e6e6e6; }
  .pill { height: 20px; border-radius: 10px; background: #fff; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; background: oklch(0.9692 0.0035 248.23); }
</style></head>
<body>
<div class="page" id="page">
<!-- Header wordmark (a purple image), found by its automation id -->
<button data-automation-id="wd_header_home_icon"><img id="logo" src="/photo.svg" alt=""></button>
<div class="card" id="card">card text</div>
<!-- Dark icon on the dark page: recolored. The same icon on a light chip: left alone. -->
<svg class="wd-icon" width="10" height="10"><path id="icon" class="wd-icon-fill" d="M0 0h10v10H0z"/></svg>
<!-- A light outline around a dark interior (Snap draws icons like this): stays an outline -->
<svg width="10" height="10"><circle id="outline" cx="5" cy="5" r="4" fill="#000" stroke="#fff" stroke-width="1"/></svg>
<!-- A progress ring (Snap): black fill at fill-opacity 0, dark stroke. Only the stroke is seen. -->
<svg width="10" height="10"><circle id="ring" cx="5" cy="5" r="4" fill="#000" fill-opacity="0" stroke="rgb(61, 92, 31)" stroke-width="2"/></svg>
<span class="chip" id="chip"><svg class="wd-icon" width="10" height="10"><path id="chipIcon" class="wd-icon-fill" d="M0 0h10v10H0z"/></svg></span>
<span class="nav" id="nav"><svg class="wd-icon" width="10" height="10"><path id="navBg" class="wd-icon-background" d="M0 0h10v10H0z"/><path class="wd-icon-fill" d="M2 2h6v6H2z"/></svg></span>
<div class="hrow" id="hrow"><span id="htext">Purchases</span></div>
<div class="grow" id="grow"><a href="#" id="gtext">Campus Resources</a></div>
<div class="org-card" id="orgCard">Khanh</div><span class="org-line" id="orgLine"></span>
<div class="prow" id="prow">Computing Services</div>
<div class="side" id="side"><div class="pill" id="pill"></div></div>
<!-- My Tasks: selected item = 5% dark tint; round sort button = 35% dark border -->
<button id="tintPill" style="all:unset;display:block;height:44px;width:200px;border-radius:600px;background:oklch(0.3343 0.0951 253.3 / 0.05)">All Items</button>
<button id="ringBtn" style="all:unset;display:block;width:32px;height:32px;border-radius:600px;border:1px solid oklch(0.2333 0.0665 257.09 / 0.35)"></button>
<button id="halfBtn" style="all:unset;display:block;width:80px;height:32px;border:1px solid oklch(0.2187 0.0685 255.77 / 0.51)">Not Now</button>
<div id="hair" style="height:20px;border-left:2px solid oklch(0.2333 0.0665 257.09 / 0.12)"></div>
<hr class="divider" id="rule">
<table><tbody id="rows"></tbody></table>
<pre id="out"></pre>
<!-- A grey selected tab on a white card; a white menu with a shadow on a grey panel -->
<div class="card" id="stepCard" style="width:200px"><div id="step" style="background:#eceff3;height:20px">Payslips</div></div>
<div class="card" style="width:200px"><div id="selItem" style="background:#f6f0ff;height:40px">Summary</div></div>
<!-- Workday's worklet cards draw their edge as an outline -->
<div class="card" id="olCard" style="width:200px;outline:0.8px solid oklch(0.856 0.0111 256.85)">Enter Time</div>
<!-- Search result link blue; a blue selected prompt row (grey text); white text on a bright blue chip -->
<a href="#" id="blueLink" style="color:#0875e1">Time Off</a>
<div id="blueRow" style="background:#0065cc;color:#3b3b3b">PJ000022</div>
<div id="blueChip" style="background:#007df6;color:#fff">is on</div>
<div class="card" style="width:220px"><div class="fade" id="fade">Personal</div></div>
<div class="bar" id="bar"><button>OK</button></div>
</div>
<div class="pop" id="pop">Unread</div>
<div class="tok" id="tok">Canvas card</div>
<div id="stripPop" style="position:absolute;top:300px;left:300px;width:200px;height:80px;box-shadow:0 2px 8px rgba(0,0,0,.3);background:#fff url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAEklEQVR4nGP4//8/AwMDAxAAAQIBAIgAAX3RYJYAAAAASUVORK5CYII=) repeat-y;background-size:80px auto">Actions</div>
<div id="photoBox" style="width:80px;height:40px;background:#fff url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAEklEQVR4nGP4//8/AwMDAxAAAQIBAIgAAX3RYJYAAAAASUVORK5CYII=);background-size:cover">photo</div>
<a href="#" id="bodyLink" style="color:#0875e1">Find Course Sections</a>
<div style="position:relative;background:#f3f5f7;width:200px;height:60px"><div id="hammy" style="position:absolute;top:4px;left:4px;width:120px;height:40px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)">Sign Out</div></div>
<div class="float-wrap"><div class="sugg" id="sugg">Find Course Sections</div></div>
<script>
// A grid row arriving after load (Workday renders grids late). Its cell is cleared
// by content.js, but reads white for a moment because of the transition.
// The nav button reaches its settled state after the first scan
setTimeout(() => document.getElementById("nav").classList.add("ready"), 400);
setTimeout(() => document.getElementById("fade").classList.add("sel"), 700);
// A class change on a card re-checks it and its light children; that must not
// switch dark mode off and on (each switch restyles the whole page)
window.__flips = "not run";
// Content arriving after load (a grid's rows) must not switch dark mode off either
window.__loadFlips = "not run";
setTimeout(() => {
  let n = 0;
  const mo = new MutationObserver((ms) => { n += ms.length; });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
  const card = document.createElement("div"); card.className = "card"; card.style.width = "200px";
  card.innerHTML = '<div style="background:#f6f7f8;height:20px">row</div><div style="background:#fff">cell</div>';
  document.getElementById("page").appendChild(card);
  setTimeout(() => { mo.disconnect(); window.__loadFlips = n; }, 400);
}, 1100);
setTimeout(() => {
  let n = 0;
  const mo = new MutationObserver((ms) => { n += ms.length; });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
  document.getElementById("stepCard").classList.add("x-selected");
  setTimeout(() => { mo.disconnect(); window.__flips = n; }, 400);
}, 1300);
// A light box added from inside a frame callback, after ours has run: a pre-paint
// observer created after the extension's must already see it dark
window.__lateSeen = "not run";
setTimeout(() => {
  const box = document.createElement("div"); box.id = "rafBox"; box.style.cssText = "width:60px;height:30px;background:#fff";
  const probe = document.createElement("div"); probe.style.cssText = "position:fixed;left:-5px;width:1px;height:1px";
  document.body.appendChild(probe);
  new ResizeObserver(() => { if (box.isConnected) window.__lateSeen = getComputedStyle(box).backgroundColor; }).observe(probe);
  requestAnimationFrame(() => requestAnimationFrame(() => { document.getElementById("page").appendChild(box); probe.style.width = "2px"; }));
}, 900);
setTimeout(() => {
  const slow = document.createElement("div");
  slow.className = "slow"; slow.id = "slow"; slow.textContent = "late box";
  document.getElementById("page").appendChild(slow);
  document.getElementById("rows").innerHTML = '<tr><td class="cell"><span id="late" style="color: oklch(0.0969 0 0 / 0.84)">Register</span></td></tr>';
}, 600);
setTimeout(() => {
  const cs = (id) => getComputedStyle(document.getElementById(id));
  document.getElementById("out").textContent = "RESULT " + JSON.stringify({
    htmlClass: document.documentElement.className,
    pageBg: cs("page").backgroundColor,
    cardBg: cs("card").backgroundColor,
    cardText: cs("card").color,
    iconFill: cs("icon").fill,
    chipIconFill: cs("chipIcon").fill,
    chipBg: cs("chip").backgroundColor,
    stepBg: cs("step").backgroundColor,
    blueLink: cs("blueLink").color,
    bodyLink: cs("bodyLink").color,
    tokBg: cs("tok").backgroundColor,
    tokText: cs("tok").color,
    tokBorder: cs("tok").borderTopColor,
    tokMarks: Object.keys(document.getElementById("tok").dataset).join(","),
    stripPopBg: cs("stripPop").backgroundColor,
    photoBoxBg: cs("photoBox").backgroundColor,
    blueRowText: cs("blueRow").color,
    blueChipText: cs("blueChip").color,
    olCardOutline: cs("olCard").outlineColor,
    selItemBg: cs("selItem").backgroundColor,
    hammyEdge: cs("hammy").boxShadow,
    outlineFill: cs("outline").fill,
    navBgFill: cs("navBg").fill,
    ringFill: cs("ring").fill,
    barBg: cs("bar").backgroundColor,
    popBg: cs("pop").backgroundColor,
    sideBg: cs("side").backgroundColor,
    pillBg: cs("pill").backgroundColor,
    tintPillBg: cs("tintPill").backgroundColor,
    ringBtnBorder: cs("ringBtn").borderTopColor,
    halfBtnBorder: cs("halfBtn").borderTopColor,
    hairBorder: cs("hair").borderLeftColor,
    orgCardEdge: cs("orgCard").boxShadow,
    orgLine: cs("orgLine").borderLeftColor,
    slowBg: cs("slow").backgroundColor,
    suggBg: cs("sugg").backgroundColor,
    lateText: cs("late").color,
    ruleBg: cs("rule").backgroundColor,
    logoTinted: cs("logo").filter !== "none",
    fadeBg: cs("fade").backgroundColor,
    rafBoxFirstPaint: window.__lateSeen,
    rescanFlips: window.__flips,
    newContentFlips: window.__loadFlips,
  });
}, 2000);
</script></body></html>
