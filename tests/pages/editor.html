<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>editor</title>
<style>.x { background: #f5f5f5; border: 1px solid #ddd; }</style></head>
<body>
<!-- Pasted-editor block: light inline background matching the (white) page behind it -->
<div id="card" style="background-color: rgba(255,255,255,.95)"><p>card text</p></div>
<!-- Light background from a stylesheet, light-grey border, low-contrast inline grey text -->
<div id="plain" class="x">plain <span style="color:#777">grey inline</span></div>
<!-- TinyMCE (Moodle 4.1+): an empty iframe the page writes its editable document into -->
<iframe id="ed"></iframe>
<pre id="out"></pre>
<script>
const f = document.getElementById("ed");
setTimeout(() => {
  const d = f.contentDocument;
  d.open();
  d.write('<!DOCTYPE html><html><head><link rel="stylesheet" href="/editor.css"></head><body id="tinymce" class="mce-content-body"><p>typed text</p><p style="color:#444">inline grey</p></body></html>');
  d.close();
}, 100);
setTimeout(() => {
  const d = f.contentDocument, cs = (el) => getComputedStyle(el), fcs = (el) => f.contentWindow.getComputedStyle(el);
  document.getElementById("out").textContent = "RESULT " + JSON.stringify({
    iframeHtmlClass: d.documentElement.className,
    iframeBodyBg: fcs(d.body).backgroundColor,
    iframeGreyText: fcs(d.body.children[1]).color,
    mainHtmlClass: document.documentElement.className,
    mainBodyBg: cs(document.body).backgroundColor,
    matchingBlockBg: cs(document.getElementById("card")).backgroundColor,
    lightBoxBg: cs(document.getElementById("plain")).backgroundColor,
    lightBoxBorder: cs(document.getElementById("plain")).borderTopColor,
    greyInlineText: cs(document.querySelector("#plain span")).color,
  });
}, 2000);
</script></body></html>
